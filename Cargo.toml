[workspace]
members = ["native/iroh-kmp-native"]
resolver = "3"

[workspace.package]
edition = "2024"
repository = "https://github.com/vafu/iroh-kmp"
rust-version = "1.91"
version = "0.1.0"

[workspace.dependencies]
bytes = "=1.12.1"
futures = "=0.3.34"
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring"] }
iroh-base = "=1.2.0"
jni = "=0.22.4"
n0-watcher = "=1.0.0"
noq-udp = "=1.3.0"
tokio = { version = "=1.51.4", features = ["macros", "sync"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
